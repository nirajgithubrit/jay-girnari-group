# Netlify — Frontend (Angular)
[build]
  base = "frontend"
  command = "npm ci && npm run build:pwa"
  publish = "dist/frontend/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  JGG_API_URL = "https://jay-girnari-group.onrender.com/api"
