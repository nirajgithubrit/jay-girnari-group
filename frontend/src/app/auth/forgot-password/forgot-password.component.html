<div class="auth-gradient flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-md animate-slide-up">
    <div class="text-center mb-8">
      <img
        src="/logo.png"
        alt="Jay Girnari Group"
        class="w-16 h-16 mx-auto rounded-xl object-contain shadow-md mb-3"
      />
      <p class="text-xl font-display font-bold text-girnar-900">Reset Password</p>
      <p class="text-sacred-gold text-sm mt-1">Jay Girnari Group</p>
    </div>

    <div class="glass-card p-6 sm:p-8 shadow-xl">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm text-girnar-700 mb-1">Email</label>
          <input type="email" formControlName="email" class="input-field" placeholder="you@email.com" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="text-xs text-red-500 mt-1 block">Valid email is required</span>
          }
        </div>

        <div>
          <label class="block text-sm text-girnar-700 mb-1">New Password</label>
          <div class="relative">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              class="input-field pr-12"
              placeholder="••••••••"
            />
            <button
              type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-girnar-500"
              (click)="togglePassword()"
              tabindex="-1"
            >
              {{ showPassword() ? '🙈' : '👁' }}
            </button>
          </div>
        </div>

        <div>
          <label class="block text-sm text-girnar-700 mb-1">Confirm Password</label>
          <input
            type="password"
            formControlName="confirmPassword"
            class="input-field"
            placeholder="••••••••"
          />
          @if (form.touched && form.errors?.['mismatch']) {
            <span class="text-xs text-red-500 mt-1 block">Passwords do not match</span>
          }
        </div>

        <button type="submit" class="btn-primary w-full" [disabled]="loading()">
          {{ loading() ? 'Updating...' : 'Submit' }}
        </button>
      </form>

      <p class="text-center text-sm text-girnar-600 mt-6">
        <a routerLink="/login" class="text-sacred-gold font-medium hover:underline">← Back to Login</a>
      </p>
    </div>
  </div>
</div>
