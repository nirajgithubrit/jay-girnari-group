<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <title>Jay Girnari Group</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Jay Girnari Group - Credit & Debit Management | Surendranagar">
  <meta name="theme-color" content="#574839">
  <meta name="color-scheme" content="light">

  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jay Girnari">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512x512.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f3ef 0%, #e8e2d6 50%, #f4e4bc 100%);
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #app-splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #app-splash img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(87, 72, 57, 0.15);
      animation: splash-pulse 1.5s ease-in-out infinite;
    }
    #app-splash p {
      margin-top: 1.25rem;
      font-family: Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #3f352d;
    }
    #app-splash span {
      margin-top: 0.5rem;
      font-size: 0.875rem;
      color: #6d5a44;
    }
    .splash-spinner {
      margin-top: 1.5rem;
      width: 32px;
      height: 32px;
      border: 3px solid #d4c9b5;
      border-top-color: #574839;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-splash" aria-live="polite">
    <img src="logo.png" alt="Jay Girnari Group" width="96" height="96" />
    <p>Jay Girnari Group</p>
    <span>Server starting up...</span>
    <div class="splash-spinner" aria-hidden="true"></div>
  </div>

  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
